[project]
name = "visual-embeddings-lab"
version = "0.1.0"
description = "Demostración local de embeddings multimodales con Ollama"
requires-python = ">=3.11"
dependencies = ["gradio>=6.0,<7", "httpx>=0.28,<0.29", "numpy>=2.2,<3", "pillow>=11,<13", "plotly>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: utiliza Ollama y el modelo real"]
